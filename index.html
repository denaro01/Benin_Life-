<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Benin Life - Odogwu Edition</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#f5f5f0;padding-bottom:80px}
#map{height:50vh;width:100%}
.top{display:flex;justify-content:space-between;padding:12px;background:#111;color:white;position:sticky;top:0;z-index:999}
.top b{color:#FFD700}
.card{background:white;margin:10px;border-radius:16px;padding:14px;box-shadow:0 2px 8px #0001}
.btn{background:#111;color:white;padding:12px 20px;border-radius:12px;border:none;width:100%;font-weight:bold;margin-top:8px}
.btn-yellow{background:#FFD700;color:#111}
.btn-blue{background:#003B73;color:white}
.nav{position:fixed;bottom:0;width:100%;background:white;display:flex;justify-content:space-around;padding:10px;border-top:1px solid #eee;z-index:1000}
.nav button{border:none;background:none;font-size:11px;text-align:center}
.garage-item{border-left:4px solid #FFD700}
.first-bank{background:linear-gradient(135deg,#FFC700,#003B73);color:white}
</style>
</head>
<body>
<div class="top"><span>⚡<b id="energy">100</b> 🍲<b id="hunger">100</b></span><span>₦<b id="bal">5000</b> 👑<b id="resp">0</b> ✈️<b id="jets">0</b></span></div>
<div id="map"></div>
<div id="mainCard" class="card">
<h3>Benin Life - Odogwu Edition</h3>
<p style="color:#666;margin:8px 0">Keke today, Private Jet tomorrow. Tap Airport for luxury.</p>
<p><b>Your Garage:</b> <span id="garageList">Keke (starter)</span></p>
</div>
<div class="nav">
<button onclick="tab('map')">🗺️<br>Map</button>
<button onclick="tab('jobs')">💼<br>Jobs</button>
<button onclick="tab('bank')">🏦<br>Bank</button>
<button onclick="tab('garage')">🚁<br>Garage</button>
<button onclick="tab('house')">🏠<br>House</button>
<button onclick="tab('chat')">💬<br>Chat</button>
</div>
<script>
let bal = localStorage.getItem('benin_bal')?parseInt(localStorage.getItem('benin_bal')):5000;
let energy=100,respect=0,garage=JSON.parse(localStorage.getItem('benin_garage')||'["Keke (starter)"]');
document.getElementById('bal').innerText=bal.toLocaleString();
document.getElementById('garageList').innerText=garage.join(', ');

var map = L.map('map').setView([6.32,5.61],12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

const places = [
{name:"Sapele Road Garage (Keke)",lat:6.3231,lng:5.6218,type:"work",pay:800,desc:"Start hustle"},
{name:"Ring Road",lat:6.3350,lng:5.6037,type:"work",pay:1200},
{name:"First Bank HQ",lat:6.3265,lng:5.6170,type:"bank"},
{name:"Oba Palace",lat:6.3338,lng:5.6080,type:"palace"},
{name:"Ihama Club",lat:6.3005,lng:5.6122,type:"party",fee:5000},
{name:"Benin Airport (BEN) - Jets & Helicopters",lat:6.3161,lng:5.6000,type:"airport"},
{name:"Koko Port - Yacht",lat:5.95,lng:5.45,type:"yacht_port"},
{name:"GRA",lat:6.3050,lng:5.6050,type:"house",rent:50000},
{name:"New Benin Market",lat:6.3530,lng:5.6172,type:"market"}
];

places.forEach(p=>{ L.marker([p.lat,p.lng]).addTo(map).on('click',()=>showPlace(p)); });

function showPlace(p){
 let html=`<h3>${p.name}</h3><p>${p.desc||''}</p>`;
 if(p.type=='work') html+=`<button class="btn btn-yellow" onclick="work(${p.pay})">Work +₦${p.pay}</button>`;
 if(p.type=='bank') html+=`<div class="first-bank card"><h3>First Bank</h3><p style="font-size:22px">₦${bal.toLocaleString()}</p><button class="btn" onclick="transfer()">Transfer</button></div>`;
 if(p.type=='airport') html+=`<p>Private Jets, Helicopters dey here. Airport pass ₦50k</p><button class="btn btn-blue" onclick="tab('garage')">Enter Airport Garage</button><button class="btn" onclick="flyJet()">Fly to Lagos (if you get Jet)</button>`;
 if(p.type=='yacht_port') html+=`<p>Koko Port - Only Yacht owners fit enter. Boat party!</p><button class="btn" onclick="yachtParty()">Yacht Party</button>`;
 if(p.type=='palace') html+=`<button class="btn" onclick="respectUp()">Oba Gha To Kpere! +10</button>`;
 if(p.type=='party') html+=`<button class="btn" onclick="party()">Enter Ihama ₦5000</button>`;
 document.getElementById('mainCard').innerHTML=html;
}
function work(pay){ if(energy<10){alert('Chop for market');return} energy-=10; bal+=pay; save(); document.getElementById('mainCard').innerHTML=`<h3>You earned ₦${pay}!</h3>`; }
function party(){ if(bal<5000){alert('Broke boy');return} bal-=5000; respect+=15; energy-=20; save(); alert('You for Ihama! DJ play Asake'); }
function yachtParty(){ if(!garage.some(g=>g.includes('Yacht'))){alert('You need Yacht, Odogwu! Go buy for Garage');return} respect+=50; alert('Koko Port Yacht Party! Big boys only. Respect +50'); }
function flyJet(){ if(!garage.some(g=>g.includes('Jet')||g.includes('Helicopter'))){alert('You need Jet/Helicopter to fly');return} energy=100; alert('✈️ You fly from Benin Airport to Lagos! No traffic, no energy waste. Odogwu!'); save(); }
function respectUp(){ respect+=10; save(); alert('Oba Gha To Kpere! Iseee!'); }
function save(){ localStorage.setItem('benin_bal',bal); localStorage.setItem('benin_garage',JSON.stringify(garage)); document.getElementById('bal').innerText=bal.toLocaleString(); document.getElementById('resp').innerText=respect; document.getElementById('jets').innerText=garage.filter(g=>g.includes('Jet')||g.includes('Helicopter')).length; document.getElementById('garageList').innerText=garage.join(', '); }
function transfer(){ let a=prompt('Amount to send?'); if(a&&bal>=a){bal-=parseInt(a); save(); alert('First Bank Transfer Success!'); } }
function buyVehicle(name,price,resp){ if(bal<price){alert('Balance no reach. You need ₦'+price.toLocaleString()+' but you get ₦'+bal.toLocaleString());return} bal-=price; respect+=resp; garage.push(name); save(); alert('You bought '+name+'! E dey for Benin Airport now.'); tab('garage'); }
function tab(t){
 let html='';
 if(t=='jobs') html='<h3>Jobs</h3><div class="card">Keke Driver ₦800 <button class="btn btn-yellow" onclick="work(800)">Work</button></div><div class="card">First Bank Marketer ₦2500 <button class="btn btn-yellow" onclick="work(2500)">Work</button></div>';
 if(t=='bank') html=`<div class="first-bank card"><h2>First Bank - ${Math.floor(Math.random()*9000+1000)} ****</h2><p style="font-size:26px">₦${bal.toLocaleString()}</p><button class="btn" onclick="transfer()">Transfer Naira</button><button class="btn" onclick="if(bal>=50000){bal-=50000; save(); alert('Airport Pass bought!');}else alert('Need ₦50k')">Buy Airport Pass ₦50k</button></div>`;
 if(t=='garage') html=`
<h3>🚁 Benin Airport Luxury Garage</h3>
<p style="color:#666">Your garage: ${garage.join(', ')}</p>
<div class="card garage-item"><b>Toyota Corolla 2008</b><br>₦2.5M | Respect +10<br><button class="btn" onclick="buyVehicle('Corolla',2500000,10)">Buy Car</button></div>
<div class="card garage-item"><b>Lexus LX 570</b><br>₦25M | Respect +40<br><button class="btn" onclick="buyVehicle('Lexus LX',25000000,40)">Buy</button></div>
<div class="card garage-item"><b>G-Wagon Brabus</b><br>₦85M | Respect +80<br><button class="btn" onclick="buyVehicle('G-Wagon',85000000,80)">Buy</button></div>
<div class="card garage-item" style="border-color:#003B73"><b>🚁 Bell 407 Helicopter</b><br>₦300M | Fly Benin to Lagos 20min | +200<br><button class="btn btn-blue" onclick="buyVehicle('Bell 407 Helicopter',300000000,200)">Buy Helicopter</button></div>
<div class="card garage-item" style="border-color:gold"><b>✈️ Learjet 45 Private Jet</b><br>₦500M | No energy for travel | +400<br><button class="btn btn-yellow" onclick="buyVehicle('Learjet 45 Private Jet',500000000,400)">Buy Jet</button></div>
<div class="card garage-item" style="border-color:gold"><b>✈️ Gulfstream G550</b><br>₦1.5B | Odogwu Jet | +1000<br><button class="btn btn-yellow" onclick="buyVehicle('Gulfstream G550 Jet',1500000000,1000)">Buy G550</button></div>
<div class="card garage-item"><b>🛥️ Private Yacht Small</b><br>₦400M | Koko Port access<br><button class="btn" onclick="buyVehicle('Small Yacht',400000000,250)">Buy Yacht</button></div>
<div class="card garage-item"><b>🛥️ Luxury Yacht Koko</b><br>₦1.2B | Biggest for Ikpoba River<br><button class="btn" onclick="buyVehicle('Luxury Yacht',1200000000,600)">Buy Luxury Yacht</button></div>
`;
 if(t=='house') html='<h3>Houses</h3><div class="card">Upper Sakponba ₦10k/week <button class="btn" onclick="if(bal>=10000){bal-=10000; respect+=10; save(); alert(\"Rented!\");}else alert(\"Broke\")}">Rent</button></div><div class="card">GRA Mansion ₦50k/week <button class="btn" onclick="if(bal>=50000){bal-=50000; respect+=25; save(); alert(\"GRA Odogwu!\");}else alert(\"Broke\")}">Rent GRA</button></div>';
 if(t=='chat') html='<h3>Benin Chat - 13k online</h3><div style="background:#eee;padding:8px;border-radius:8px"><p><b>OdogwuJet:</b> Who dey Benin Airport?</p><p><b>EdoBabe:</b> I need Yacht party invite</p></div>';
 if(t=='map') { location.reload(); return; }
 document.getElementById('mainCard').innerHTML=html;
}
save();
</script>
</body>
</html>
